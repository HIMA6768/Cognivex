[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognivex"
version = "0.1.0"
description = "Breast cancer prognosis and subtype classification research prototype"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.39,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
data-preparation = [
    "pandas>=3,<4",
    "scikit-learn>=1.5,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
