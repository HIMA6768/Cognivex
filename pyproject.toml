[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognivex"
version = "0.1.0"
description = "Breast cancer prognosis and subtype classification research prototype"
requires-python = ">=3.11"
dependencies = [
    "lifelines==0.30.3",
    "numpy>=2,<3",
    "pandas==2.3.3",
    "scikit-learn>=1.5,<2",
    "streamlit>=1.39,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
