[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognivex"
version = "0.1.0"
description = "Vehicle damage assessment application"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.39,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
